name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "esquema.sql"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "esquema.sql"
      - ".github/workflows/backend-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rides_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rides_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/rides_test

  migration:
    # Verifica que la migración aplica sobre el esquema y que no se aplica dos veces.
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rides_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rides_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://test:test@localhost:5432/rides_test
    steps:
      - uses: actions/checkout@v4
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -f esquema.sql
      - name: La migración aborta si ya está aplicada
        run: |
          if psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction \
               -f backend/migrations/001_mejora_vanna.sql; then
            echo "La migración debió abortar" && exit 1
          fi
