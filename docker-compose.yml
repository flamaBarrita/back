services:
  # --- BASE DE DATOS (PostGIS) ---
  db:
    # postgis/postgis solo existe para amd64. En servidores ARM (OCI Ampere A1)
    # definir POSTGIS_IMAGE=imresamu/postgis:15-3.4 (misma imagen, multi-arch).
    image: ${POSTGIS_IMAGE:-postgis/postgis:15-3.4}
    container_name: rides_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: rides_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - rides_network
    # Optimización para tu servidor de 4GB de RAM
    command: postgres -c shared_buffers=1GB -c effective_cache_size=2GB -c work_mem=16MB
    # Healthcheck para que el backend no intente conectarse antes de que la BD despierte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d rides_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- BACKEND (FastAPI) ---
  # El comando de arranque (uvicorn con 2 workers) y el healthcheck están en
  # el Dockerfile.
  backend:
    build:
      context: ./backend
    container_name: rides_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASS}@db:5432/rides_db
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      TRIP_ACTIVE_GRACE_MINUTES: ${TRIP_ACTIVE_GRACE_MINUTES:-120}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase.json
    # Las credenciales de Firebase no entran en la imagen: se montan en solo
    # lectura. Si el archivo falta, la API arranca igual sin notificaciones push.
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE:-./backend/app/firebase.json}:/run/secrets/firebase.json:ro
    depends_on:
      db:
        condition: service_healthy # Espera a que Postgres pase el test de arriba
    networks:
      - rides_network
    ports:
      - "8000:8000" # Único puerto expuesto a internet

# Volúmenes administrados por Docker (Máxima seguridad y persistencia)
volumes:
  pg_data:

networks:
  rides_network:
    driver: bridge
